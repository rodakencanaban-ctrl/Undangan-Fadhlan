<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="Undangan Walimatul Khitan Awaluddin Fadhlan Fathurrahman">
<title>Walimatul Khitan Fadhlan</title>

<style>
:root {
  --cream:#f5ead8;
  --green:#005b43;
  --gold:#ffd53d;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; background:var(--cream); }
body {
  margin:0; min-width:320px; overflow-x:hidden;
  background:#e9ddc7; color:var(--green);
  font-family:Arial,Helvetica,sans-serif;
}
button { font:inherit; }
.sr-only {
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

/* ================= SHARED 9:16 CANVAS ================= */
.page {
  min-height:100svh; display:grid; place-items:center; overflow:hidden;
}
.stage {
  position:relative;
  width:min(100vw, calc(100svh * 9 / 16));
  max-height:100svh;
  aspect-ratio:9/16;
  overflow:hidden; isolation:isolate;
  background:var(--cream);
  box-shadow:0 10px 42px rgba(0,60,43,.14);
}
.bg {
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:fill;z-index:1;pointer-events:none;user-select:none;
}
.asset {
  position:absolute;pointer-events:none;
  will-change:transform,opacity,filter;
}
.asset img {
  width:100%;height:100%;display:block;object-fit:contain;
  user-select:none;-webkit-user-drag:none;
}
.reveal-bg { opacity:0; transform:scale(1.02); }
.in-view .reveal-bg { animation:sectionBgIn .95s ease .05s forwards; }
@keyframes sectionBgIn { to{opacity:1;transform:scale(1)} }

/* ================= COMMON LAMP MOTION ================= */
.section-lamp-l,.section-lamp-r {
  z-index:3;opacity:0;transform-origin:50% 0%;
}
.in-view .section-lamp-l {
  animation:lampLIn .88s cubic-bezier(.16,.8,.22,1) .22s forwards,
            swingL 5.1s ease-in-out 1.18s infinite;
}
.in-view .section-lamp-r {
  animation:lampRIn .9s cubic-bezier(.16,.8,.22,1) .30s forwards,
            swingR 5.55s ease-in-out 1.28s infinite;
}
@keyframes lampLIn {
  from{opacity:0;transform:translateY(-24px) rotate(-3deg) scale(.96);filter:blur(1px)}
  to{opacity:1;transform:translateY(0) rotate(-1.4deg) scale(1);filter:blur(0)}
}
@keyframes lampRIn {
  from{opacity:0;transform:translateY(-24px) rotate(3deg) scale(.96);filter:blur(1px)}
  to{opacity:1;transform:translateY(0) rotate(1.35deg) scale(1);filter:blur(0)}
}
@keyframes swingL {0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.6deg)}}
@keyframes swingR {0%,100%{transform:rotate(1.35deg)}50%{transform:rotate(-1.55deg)}}

/* ================= COVER ================= */
.cover {
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;
  overflow:hidden;background:var(--cream);
  transition:transform .88s cubic-bezier(.22,.75,.18,1),opacity .62s ease,visibility .88s;
}
.cover::before {
  content:"";position:absolute;inset:-44px;
  background:url("assets/cover_bg.png") center/cover no-repeat;
  filter:blur(26px);transform:scale(1.12);opacity:.65;
}
.cover.opened {
  transform:translateY(-102%);opacity:0;visibility:hidden;pointer-events:none;
}
.cover .bg {opacity:0;transform:scale(1.025)}
body.ready .cover .bg {animation:coverBgIn 1.1s ease .05s forwards}
@keyframes coverBgIn {to{opacity:1;transform:scale(1)}}

.cover-lamp-l { left:4.722222%;top:0.000000%;width:13.703704%;height:28.489583%; z-index:3;opacity:0;transform-origin:50% 0%; }
.cover-lamp-r { left:81.481481%;top:0.000000%;width:13.518519%;height:28.020833%; z-index:3;opacity:0;transform-origin:50% 0%; }
body.ready .cover-lamp-l {
  animation:lampLIn .9s cubic-bezier(.16,.8,.22,1) .34s forwards,
            swingL 5.1s ease-in-out 1.30s infinite;
}
body.ready .cover-lamp-r {
  animation:lampRIn .92s cubic-bezier(.16,.8,.22,1) .42s forwards,
            swingR 5.55s ease-in-out 1.38s infinite;
}
.cover-child {
  left:32.500000%;top:38.020833%;width:32.222222%;height:25.156250%; z-index:4;opacity:0;
  transform:translateY(22px) scale(.92);transform-origin:50% 100%;
}
body.ready .cover-child {
  animation:childIn 1.05s cubic-bezier(.16,.8,.25,1) .72s forwards,
            floatChild 5.4s ease-in-out 1.95s infinite;
}
@keyframes childIn {
  0%{opacity:0;transform:translateY(22px) scale(.92);filter:blur(2px)}
  72%{opacity:1;transform:translateY(-2px) scale(1.008);filter:blur(0)}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
@keyframes floatChild {
  0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}
}
.cover-name-time {
  left:24.537037%;top:59.895833%;width:47.500000%;height:21.822917%; z-index:6;opacity:0;transform:translateY(16px) scale(.975);
}
body.ready .cover-name-time {animation:uiIn .82s cubic-bezier(.2,.8,.2,1) 1.18s forwards}
@keyframes uiIn {to{opacity:1;transform:translateY(0) scale(1)}}
.cover-button {
  left:27.314815%;top:81.250000%;width:42.777778%;height:6.093750%; z-index:7;opacity:0;transform:translateY(12px) scale(.9);
}
body.ready .cover-button {
  animation:buttonIn .72s cubic-bezier(.2,.85,.22,1.25) 1.52s forwards,
            buttonBreath 2.6s ease-in-out 2.35s infinite;
}
@keyframes buttonIn {
  75%{opacity:1;transform:translateY(-1px) scale(1.025)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes buttonBreath {
  0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,215,79,0))}
  50%{transform:scale(1.018);filter:drop-shadow(0 0 9px rgba(255,215,79,.34))}
}
.open-hotspot {
  position:absolute;z-index:10;left:27.314815%;top:81.250000%;width:42.777778%;height:6.093750%;
  border:0;background:transparent;padding:0;border-radius:999px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  opacity:0;pointer-events:none;
}
body.ready .open-hotspot {animation:hotspotOn .01s linear 1.95s forwards}
@keyframes hotspotOn {to{opacity:1;pointer-events:auto}}

/* ================= CONTENT ================= */
#content {opacity:0;transition:opacity .5s ease .12s}
#content.visible {opacity:1}

/* ================= PEMBUKAAN ================= */
.opening-lamp-l { left:4.722222%;top:0.000000%;width:13.703704%;height:28.489583%; }

/* ================= PROFIL ================= */

/* LIVE HTML NUMBERS over the Canva panel */
.count-number {
  position:absolute;z-index:8;
  transform:translate(-50%,-50%);
  min-width:22%;
  text-align:center;
  color:#ffd53d;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(44px,11.5vw,72px);
  line-height:1;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;
  text-shadow:
    0 2px 0 rgba(77,54,0,.25),
    0 5px 12px rgba(0,0,0,.22);
  opacity:0;
}
.in-view .count-number {
  opacity:1;
  animation:numberIn .6s cubic-bezier(.2,.9,.2,1.15) .92s both;
}
@keyframes numberIn {
  from{opacity:0;transform:translate(-50%,-50%) scale(.72)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.count-number.tick {
  opacity:1;
  animation:numberTick .28s ease;
}
@keyframes numberTick {
  0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  45%{opacity:1;transform:translate(-50%,-50%) scale(1.10)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

.count-finished.show {

}
@keyframes finishedIn {to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* NEXT */
.next-hint {

<script>
(() => {
  const body = document.body;
  const cover = document.getElementById('cover');
  const openBtn = document.getElementById('openBtn');
  const content = document.getElementById('content');
  const bgMusic = document.getElementById('bgMusic');
  const musicControl = document.getElementById('musicControl');

  bgMusic.volume = 0.30;

  async function startBackgroundMusic() {
    try {
      await bgMusic.play();
      musicControl.classList.remove('paused');
      musicControl.setAttribute('aria-label', 'Jeda musik');
    } catch (err) {
      musicControl.classList.add('paused');
      musicControl.setAttribute('aria-label', 'Putar musik');
    }
  }

  if (new URLSearchParams(location.search).get('debug') === '1') {
    body.classList.add('debug');
  }

  body.style.overflow='hidden';

  window.addEventListener('load', () => {
    requestAnimationFrame(() => body.classList.add('ready'));
  });

  openBtn.addEventListener('click', () => {
    if (cover.classList.contains('opened')) return;
    cover.classList.add('opened');
    content.classList.add('visible');
    content.setAttribute('aria-hidden','false');
    body.style.overflow='auto';
    body.classList.add('invitation-open');

    startBackgroundMusic();

    setTimeout(() => {
      document.getElementById('pembukaan')
        .scrollIntoView({behavior:'smooth',block:'start'});
    },220);
  });

  // Entrance per page saat benar-benar masuk viewport
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');

        if (entry.target.id === 'countdown') {
          setTimeout(updateCountdown, 50);
        }
      }
    });
  },{threshold:.32});

  document.querySelectorAll('.observed-page').forEach(p => observer.observe(p));

  document.querySelectorAll('[data-scroll]').forEach(btn => {
    btn.addEventListener('click', () => {
      const target=document.getElementById(btn.dataset.scroll);
      if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });

  musicControl.addEventListener('click', async () => {
    if (bgMusic.paused) {
      await startBackgroundMusic();
    } else {
      bgMusic.pause();
      musicControl.classList.add('paused');
      musicControl.setAttribute('aria-label', 'Putar musik');
    }
  });

  bgMusic.addEventListener('play', () => {
    musicControl.classList.remove('paused');
    musicControl.setAttribute('aria-label', 'Jeda musik');
  });

  bgMusic.addEventListener('pause', () => {
    musicControl.classList.add('paused');
    musicControl.setAttribute('aria-label', 'Putar musik');
  });

  /* =======================================================
     COUNTDOWN
     Target: Minggu, 30 Agustus 2026 pukul 10:00 WIB (UTC+7)
     ======================================================= */
  const targetTime = new Date('2026-08-30T10:00:00+07:00').getTime();

  const els = {
    days: document.getElementById('days'),
    hours: document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    seconds: document.getElementById('seconds')
  };
  const finished = document.getElementById('countFinished');

  function pad(n) {
    return String(Math.max(0,n)).padStart(2,'0');
  }

  function setValue(el,value) {
    if (el.textContent !== value) {
      el.textContent=value;

      const countdownPage = document.getElementById('countdown');
      if (countdownPage.classList.contains('in-view')) {
        el.classList.remove('tick');
        void el.offsetWidth;
        el.classList.add('tick');
      }
    }
  }

  function updateCountdown() {
    const now=Date.now();
    let distance=targetTime-now;

    if(distance<=0) {
      distance=0;
      finished.classList.add('show');
    }

    const dayMs=1000*60*60*24;
    const hourMs=1000*60*60;
    const minuteMs=1000*60;

    const days=Math.floor(distance/dayMs);
    const hours=Math.floor((distance%dayMs)/hourMs);
    const minutes=Math.floor((distance%hourMs)/minuteMs);
    const seconds=Math.floor((distance%minuteMs)/1000);

    setValue(els.days,pad(days));
    setValue(els.hours,pad(hours));
    setValue(els.minutes,pad(minutes));
    setValue(els.seconds,pad(seconds));
  }

  updateCountdown();
  setInterval(updateCountdown,1000);

  /* RSVP prototype — penyimpanan lokal browser */
  const RSVP_STORAGE_KEY = 'fadhlan_rsvp_v1';

  const rsvpName = document.getElementById('rsvpName');
  const rsvpAttendance = document.getElementById('rsvpAttendance');
  const rsvpMessage = document.getElementById('rsvpMessage');
  const rsvpSubmit = document.getElementById('rsvpSubmit');
  const rsvpList = document.getElementById('rsvpList');
  const rsvpTotal = document.getElementById('rsvpTotal');
  const rsvpPresent = document.getElementById('rsvpPresent');
  const rsvpAbsent = document.getElementById('rsvpAbsent');
  const rsvpFeedback = document.getElementById('rsvpFeedback');

  function loadRsvp() {
    try {
      const raw = localStorage.getItem(RSVP_STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveRsvp(entries) {
    localStorage.setItem(RSVP_STORAGE_KEY, JSON.stringify(entries));
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function renderRsvp() {
    const entries = loadRsvp();
    const hadir = entries.filter(item => item.attendance === 'Hadir').length;
    const tidak = entries.filter(item => item.attendance === 'Tidak Hadir').length;

    rsvpTotal.textContent = `${entries.length} Konfirmasi`;
    rsvpPresent.textContent = `${hadir} Hadir`;
    rsvpAbsent.textContent = `${tidak} Tidak Hadir`;

    if (!entries.length) {
      rsvpList.innerHTML = '<div class="rsvp-empty">Belum ada konfirmasi tamu.</div>';
      return;
    }

    rsvpList.innerHTML = entries.slice().reverse().map(item => {
      const statusClass = item.attendance === 'Hadir' ? 'hadir' : 'tidak';
      const message = item.message
        ? `<p class="rsvp-card-message">${escapeHtml(item.message)}</p>`
        : '';

      return `
        <article class="rsvp-card">
          <div class="rsvp-card-head">
            <span class="rsvp-card-name">${escapeHtml(item.name)}</span>
            <span class="rsvp-status ${statusClass}">${escapeHtml(item.attendance)}</span>
          </div>
          ${message}
        </article>`;
    }).join('');
  }

  function showRsvpFeedback(message) {
    rsvpFeedback.textContent = message;
    rsvpFeedback.classList.add('show');
    setTimeout(() => rsvpFeedback.classList.remove('show'), 2200);
  }

  rsvpSubmit.addEventListener('click', () => {
    const name = rsvpName.value.trim();
    const attendance = rsvpAttendance.value;
    const message = rsvpMessage.value.trim();

    if (!name) {
      showRsvpFeedback('Silakan isi nama tamu.');
      rsvpName.focus();
      return;
    }

    if (!attendance) {
      showRsvpFeedback('Silakan pilih kehadiran.');
      rsvpAttendance.focus();
      return;
    }

    const entries = loadRsvp();
    entries.push({
      name,
      attendance,
      message,
      createdAt: new Date().toISOString()
    });

    saveRsvp(entries);
    renderRsvp();

    rsvpName.value = '';
    rsvpAttendance.value = '';
    rsvpMessage.value = '';

    showRsvpFeedback('Konfirmasi berhasil disimpan.');

    setTimeout(() => {
      document.getElementById('rsvpFeed')
        .scrollIntoView({behavior:'smooth',block:'start'});
    }, 250);
  });

  renderRsvp();

  /* PENUTUP — kembali ke cover */
  const backToTop = document.getElementById('backToTop');

  backToTop.addEventListener('click', () => {
    window.scrollTo({top:0, left:0, behavior:'smooth'});

    setTimeout(() => {
      cover.classList.remove('opened');
      body.style.overflow='hidden';
      body.classList.remove('invitation-open');

      bgMusic.pause();
      bgMusic.currentTime = 0;
      musicControl.classList.add('paused');
      musicControl.setAttribute('aria-label', 'Putar musik');
    }, 260);
  });

})();
</script>

<audio id="bgMusic" loop preload="auto">
  <source src="assets/background-music.mp3" type="audio/mpeg">
</audio>

<button
  id="musicControl"
  class="music-control"
  type="button"
  aria-label="Jeda musik"
  title="Play / Pause Musik"
>
  <span class="music-icon" aria-hidden="true"></span>
</button>

</body>
</html>
