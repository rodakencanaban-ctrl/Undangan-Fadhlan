name: Fix cover startup

on:
  push:
    paths:
      - '.github/workflows/fix-cover.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          music = '''<audio id="bgMusic" loop preload="auto">
            <source src="assets/background-music.mp3" type="audio/mpeg">
          </audio>

          <button
            id="musicControl"
            class="music-control"
            type="button"
            aria-label="Jeda musik"
            title="Play / Pause Musik"
          >
            <span class="music-icon" aria-hidden="true"></span>
          </button>'''

          # Hapus blok audio/control yang saat ini berada setelah script.
          html = html.replace('\n' + music + '\n\n</body>', '\n</body>', 1)

          # Letakkan audio/control sebelum script utama agar JS dapat menemukannya.
          if music not in html.split('<script>', 1)[0]:
              html = html.replace('\n<script>\n', '\n' + music + '\n\n<script>\n', 1)

          old = '''  const bgMusic = document.getElementById('bgMusic');
          const musicControl = document.getElementById('musicControl');

          bgMusic.volume = 0.30;'''
          new = '''  const bgMusic = document.getElementById('bgMusic');
          const musicControl = document.getElementById('musicControl');

          // Cover tidak boleh bergantung pada keberhasilan audio.
          requestAnimationFrame(() => body.classList.add('ready'));

          if (bgMusic) bgMusic.volume = 0.30;'''
          html = html.replace(old, new, 1)

          old2 = '''  async function startBackgroundMusic() {
            try {
              await bgMusic.play();'''
          new2 = '''  async function startBackgroundMusic() {
            if (!bgMusic || !musicControl) return;
            try {
              await bgMusic.play();'''
          html = html.replace(old2, new2, 1)

          p.write_text(html, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix cover startup and music initialization"
          git push
